; Mercs2Fix - annotated configuration
;
; The file the plugin actually reads is the short Mercs2Fix.ini beside it.  This copy
; documents every key that still does something, including the developer switches that
; ship switched off, and keeps the reverse-engineering notes behind each patch.
;
;
; v41 is the first build driven by the full static reverse-engineering of the
; camera runtime (re-notes/B-camera-runtime.md), which explains why v19..v40
; never changed anything: the HumanCameraModifier record's aim-assist floats are
; NOT the values the game uses.  One routine, 0x0071C090, reads the record and
; treats +0x20 RotationSpeed and +0x24 AimAssist as ENUMS: only when a slot holds
; 3 ("auto") does it derive a tier from the floats (1.0 / 0.1 / 1.25 / 0.75
; thresholds), and otherwise the raw int is used straight as a row index into a
; hard-coded 3-row constant table built by the constructor at 0x0071EB10.  That is
; why zeroing +00..+0C did nothing (the row is unchanged) and why writing a float
; bit pattern into +0x24 crashed the game on save load: 1.0f is the integer
; 1065353216, an index ~31 GB into a table with three rows.
; The features now target the single proven runtime site for each, at addresses
; verified byte-exact against the on-disk image.  Aim assist: one routine
; (0x0071D5B0), one call site (0x0071DC28), and its return is ADDED to the mouse yaw
; before the yaw is stored at 0x0071DC32, so NOPping those 4 store bytes leaves the
; yaw exactly as the mouse path wrote it (v41 rewrote the call plus the store instead
; and crashed - see the [AimAssist] note).  v43 also proved this routine is now fully
; dead: it stores to nothing but its own frame, the blend weight obj+0x780 and a small
; struct at obj+0x784, and obj+0x780 is read by no code outside the routine itself.
; Turret dampening: THREE mechanisms keyed on the manned flag obj+0x7DD - two
; 14-float parameter sets (manned obj+0x690/0x6C8 vs normal 0x620/0x658, selected by
; two jne at 0x0071DAE3/0x0071DAFE), the smoothing coefficient ([ebp+0x9F4] vs
; [ebp+0x9F0], je at 0x0071BE50), and the explicit x0.25 on the per-axis sensitivities
; (0x0071E54E, load operand swapped at 0x0071E557).  v42 shipped only the third and
; the turret stayed sluggish, so v43 defeats all three.
;
; History: v39 was the decisive negative for the parameter theory: 155 call-site stubs
; were installed at startup and a level load demonstrably ran afterwards (the
; capture in the same second reported 1076 seat records committed and the camera
; map filling 0 -> 44) - yet ZERO named reads fired.  So the ~780 "mov edx,
; offset Name / call GetSettingFloat" sites in .text are not the code path the
; game uses.  v40 stops guessing sites and instruments the getter itself:
;   A  0x82427A  inside HashName  -> which setting name is being hashed, and who
;      called the hasher (return address 0x656329 = GetSettingFloat)
;   B  0x65639C  on the float exit -> the value streamed from the shipped data
;   C  0x656355  on the default exit -> proves the name is absent from a record
; All three have branch-free stolen bytes, so they cannot corrupt the caller.
; If A/B/C stay at zero through a real load, the parameters are produced inside
; SecuROM's private region and the only honest route left is the shipped data
; (data/vz.wad) or compensating at the input layer.
; v38 cracked the architecture.  The SecuROM import thunk at 0x9EE832 resolves
; at runtime to 0x6A794FB0, which is not in any module on disk - it is SecuROM's
; own allocated region, and its bytes are a plain memmove.  So the seat path
; really is a copy, and the v38 settings-table dump showed why our writes never
; landed: *[0xEDC6DC] (descriptor array) and *[0xEDC6D8] (the value stream
; reader) are both NULL during gameplay.  Disassembly of GetSettingFloat
; (0x656320) confirms it hashes the name and then STREAM-READS the value out of
; the data file while a record loads.  Parameters exist exactly once, at load
; time; everything after that is a copy we cannot see.
; v39 therefore stops writing to copies and intercepts the reads instead - see
; [Settings] below for the mechanism and the new switches.  All camera and seat
; writes stay off.

[Borderless]
Enabled=1
ForceWindowedD3D=1
VsyncOff=0

[AimAssist]
Disable=1
; v36 proved writing these fields changes nothing. Off for v37.
ZeroFields=0
ZeroAimMode=0
; v41: Watchdog=0 - it only re-runs the (now known ineffective) camera-map writes,
; and DumpCameraEnums in the capture window reports the map contents directly.
Watchdog=0
PatchAtInsert=0
InsertLogging=0
DefaultPatches=0
NopCameraCall=0
DiagHook=0
; v41 PRIMARY FIX.  Aim assist is one routine, 0x0071D5B0, with exactly one call
; site: 0x0071DC28 inside the per-frame camera update.  It does not gate the yaw,
; it ADDs to it - the last arithmetic before its return is `addss xmm0,[yaw]`, and
; ONE instruction delivers the sum: `movss [[ebp+0x18]],xmm0` at 0x0071DC32.  The
; caller has already written the pre-assist yaw to that same address at 0x0071DBC6,
; so NOPping those 4 bytes leaves the yaw exactly as the mouse produced it while
; changing nothing else - no esp change, no register change, and the call still runs
; so the callee's `ret 0x14` argument cleanup stays intact.
NopAssistStore=1
; v41 removed the CALL instead of the store and crashed the game ~7s into a save load,
; exactly when player control returned and this handler began running per frame.  The
; reason is worth keeping: those 20 bytes of stack arguments are released by the
; callee's `ret 0x14`, and the `pop edi / pop esi` immediately after the call depends
; on that.  A pass-through leaves esp 0x14 bytes too low, so the two pops read the
; argument floats into edi/esi and the function returns having destroyed the caller's
; saved registers.  Never patch this call site without accounting for the cleanup -
; disable it through the store, as above.
; v43 verification of the above, from the full disassembly of 0x0071D5B0: it stores to
; nothing but its own stack frame, the blend weight obj+0x780 and the small struct at
; obj+0x784, and obj+0x780 is read by no code outside 0x0071D5B0 itself - so with the
; store NOPped this routine has ZERO remaining path to the camera.  Not skipping the
; call is therefore not a gap: nothing it still does can reach the view.  If targets
; still snap, the cause is a different subsystem (the untouched LockOn* family and the
; camera smoothing/inertia chain 0x0071BE30 / 0x0071C090 / 0x0071C670 are the leads),
; not a partially applied assist patch.
; 0x0071D657 compares a rate argument against the .data float [0x00DFDCB4] (0.98),
; but it is a strength SELECTOR, not a gate: above 0.98 the assist uses bundle f4
; (0.2, the gentle "already on target" case), below it f3/f5 (0.7/0.8).  Setting it
; to 2.0 therefore makes the assist pull HARDER - earlier notes called this a
; "reticle cone" and that reading was wrong.  Left off deliberately.
ConeDisable=0
; Alternative variant of the same idea: NOP the store of the smoothed stickiness
; weight (movss [esi+0x780],xmm0 at 0x0071D729) so it never rises off 0.0.  Not
; expected to fully disable anything - the weight is re-lerped from memory every
; frame - so it is here as a bisect tool only.
KillWeight=0
; v45.  The assist above is provably dead and the reticle still grabs enemies, because the
; grab is a DIFFERENT subsystem: a lock-on state machine at 0x0071D0A0 with exactly one call
; site (0x0071DE2B, inside the per-frame update 0x0071DC40 and AFTER the assist block).  It
; keeps a phase int at obj+0x974 and hold weights at obj+0x984 (yaw) / obj+0x988 (pitch), and
; its only route to the view is one instruction:
;   0x0071D556  D9 9E 18 06 00 00   fstp dword ptr [esi+0x618]
; which overwrites the yaw accumulator with the clamped lock value.  Free aim is not lost by
; dropping it, because the mouse enters that same accumulator later as an ADD at 0x0071DE59.
; IMPORTANT - this is NOT implemented as a NOP.  `fstp` is the instruction that POPS ST(0),
; and the value came back on the x87 stack from `call 0x00822CB0` three bytes earlier, so
; deleting the store leaks one FPU register per frame.  The 6 bytes are instead rewritten to
; `fstp dword ptr [<discard float in the .asi>]`: same length, same pop, same flags, and the
; number lands in our own variable instead of the camera.  Set to 0 to get the grab back.
NopLockOnHold=1

[Prompts]
; v45.  On keyboard+mouse the HUD draws CONSOLE controller glyphs because a global input-mode
; dword at 0x014A3818 (0 = keyboard+mouse, 1 = pad, 2 = pad with XInput) latches onto the pad
; the moment any XInput byte moves, and a sticky byte at 0x014A381C keeps re-asserting it.
; Both pad values come from plain absolute stores - `C7 05 18 38 4A 01 <imm32>` at 0x004FB13D
; (imm 1) and 0x004FB150 (imm 2) - so this patch rewrites the two IMMEDIATES to 0 and nothing
; else.  No control flow, no registers, no stack: the detection state machine still runs, it
; just can never publish a pad mode.
; The keyboard art already ships.  The exe holds a pad->keyboard SPRITE remap table at
; 0x005BB953 (11 pairs) and a prompt-TEXT remap at 0x00626081, both gated on "XInput present
; AND mode == 0" - which is exactly the state this produces while the pad stays plugged in.
; Leave the controller connected.  Unplugging it makes the XInput user index -1, the remap
; gates stop firing, and prompts fall back to pad art.
; Two known limits, both cosmetic and both in the game's own text layer: the markup expander
; at 0x00623F00 substitutes around 50 hardcoded pad-worded tokens ([aim], [right stick],
; [dpad left], [bash], [sfire], [pda], ...) and there are no keyboard equivalents in it, so
; some tutorial sentences may still name stick actions.  Verify in-game, and note that the
; CAPTURE GFX line reports [0x014A3818] so a capture proves which mode the game settled on.
; v45 RESULT - the above is verified and it still did nothing, so the model is incomplete.
; The patch applied (log: "Prompt: input-mode stores forced to 0 ... (applied)"), and every
; capture read back exactly the state the remap wants: `input mode [0x014A3818]=0  stickyPad
; [0x014A381C]=0  padActivity [0x014A3830]=0  xinputUser [0x014A2C14]=0`.  The glyphs did not
; change, and plugging a pad in produced no Xbox glyphs either - i.e. the icons being shown
; are not driven by this global at all, and this whole mode path may be a dead legacy input
; layer while the Scaleform HUD picks its art somewhere else.  xinputUser=0 is also
; ambiguous: 0 is a valid player index and "no user" is normally -1, so with the pad
; unplugged the remap gate may be reporting the wrong thing rather than failing.  KeyboardIcons
; stays 1 because forcing mode 0 is harmless and it is the state the shipped remap tables
; expect, but the next step is identification, not another write: a screenshot of one prompt
; as drawn (which art, on which screen) is what locates the sprite or the .gfx/Lua reference.
KeyboardIcons=1

[Turret]
; RESULT OF THE v46 SCAN, and the user's own two tests, which narrow this a lot:
;   - Capping the game at 60 fps (Riva Tuner) changed NOTHING: the turret stayed sluggish and
;     the crouch pitch block stayed.  So frame-rate coupling is not the cause of either.
;   - Free aim WITHOUT pressing C feels fine.  Only C-crouch/ADS and the turret are slow, and
;     the pitch axis is dead for a few moments right after C.
;   => the limiter is state-specific, not a global sensitivity problem.  The live objects are:
;   HUMAN 0x00BD2100 readable at 0x1DFBCA60 during play, CAM-E 0x00BD2200 readable at
;   0x1EA10700, and one instance of every other class matched but faulted on read (those are
;   coincidental dwords, not objects).  The readable HUMAN object had manned=0, latch=0,
;   phase=2, +0x414=+0x418=1.0 (so the x0.25 scale had already resolved to 1.0 in that frame),
;   +0x760=0.852, and its four parameter sets present as expected.
; A single instant cannot show what happens DURING the crouch, so v47 added a continuous
; read-only camera watch (removed in v75 - it only ever logged).  Note the three patches in
; this section are still ACTIVE, so the watch saw the state the player actually felt.
; v46 OPEN QUESTION, and the reason this build changes no game bytes.  Everything shipped
; since v42 sits inside 0x0071A000..0x0071F000, which is ONE class - the camera modifier
; whose vtable is 0x00BD2100.  In .data there are FIVE sibling classes with an identical
; 20-slot vtable layout next to each other:
;   0x00BD2060 ctor 0x00715D46  update 0x00717A80  events 0x00717B00
;   0x00BD20B0 ctor 0x00718FE5  update 0x00719160  events 0x00719C10
;   0x00BD2100 ctor 0x0071AA8B  update 0x0071DC40  events 0x0071E730   <- every patch so far
;   0x00BD2158 ctor 0x0072073F + 0x00720780 (two stores, so this one is a RUNTIME vtable
;                switch, not a construction)  update 0x00720C10  events 0x00720990
;   0x00BD2200 ctor 0x00722C87  update 0x00723140  events 0x00723620
; If the manned view is a different member of the family, that alone explains "all four
; dampener patches applied and the turret is still sluggish" - they were aimed at a class
; the turret camera is not.  v46's CAPTURE CAMOBJ lines scan for all five and say which are
; live.  Do not compare field numbers across classes: 0x00BD2158 reuses +0x610..+0x618 for
; a rotated 3-vector and +0x620 as a plain dword, so identical offsets mean different things.
; Manned-weapon dampening is THREE mechanisms keyed on one byte, the camera
; object's manned flag at obj+0x7DD (written at 0x0071E9DD from event hash 0xDF09BB24, and
; also at 0x0071E83B from event 0x77ED14F8 - the second writer was found in v45's RE pass).
; This is mechanism 3 and the most literal one: 0x0071DC40 loads
; 0.25 from [0x00BBC7EC] while manned and 1.0 from [0x00B9B664] otherwise, then
; multiplies the two per-axis sensitivities obj+0x414 / obj+0x418 by it.
; Swapping the load operand for the 1.0 that is already in .rdata is the same
; instruction length and leaves the branch intact.
MountedScaleOne=1
; Mechanism 1 of 3: while manned, the camera update copies the MANNED 14-float
; parameter set instead of the normal one - obj+0x690 (and a second group at
; obj+0x6C8) rather than obj+0x620 / obj+0x658 - and rep movsd puts the chosen set
; on the stack where 0x0071DB0C onwards uses it as the per-axis turn-rate
; multipliers.  The manned `lea esi,[ebx+0x690]` runs unconditionally and the two
; `jne` (75 06 at 0x0071DAE3 and 0x0071DAFE) only skip the normal `lea`, so NOPping
; both selects the normal sets while leaving obj+0x7DD itself - and everything else
; that reads it - untouched.
ForceNormalParams=1
; Mechanism 2 of 3: 0x0071BE30 picks the ring-buffer smoothing coefficient from
; [ebp+0x9F4] while manned and [ebp+0x9F0] otherwise (`cmp byte [ebp+0x7DD],0` /
; `je 0x0071BE5C` at 0x0071BE50).  The displacement is identical, so making that
; branch unconditional (74 0A -> EB 0A) takes the normal smoothing.
ForceNormalSmooth=1
; Diagnostic that removes all three mechanisms at once, because they all read
; obj+0x7DD: store 0 instead of 1 for the manned flag at 0x0071E9DD.  Off by
; default - it is a bigger semantic hammer than the three targeted switches above,
; which each change exactly one consumer.  Set to 1 only if the three above leave
; the turret still sluggish.
NeverManned=0
; ---------------------------------------------------------------------------------------
; v56, AND THE FIRST SWITCH IN THIS SECTION THAT IS AIMED AT THE RIGHT CLASS.
; The four keys above all patch the HUMAN camera (vtable 0x00BD2100).  The v55/v56 external
; probe settled the question the v46 note below raised: while you are mounted, HUMAN IS NOT
; ALLOCATED AT ALL.  The only camera object in the entire 1174 MB heap is CAM-E (vtable
; 0x00BD2200), created on mount and freed on dismount - proven causally in run 3 by the
; vtable field changing to a heap address for 4.9 s across a dismount and back on remount.
; That is why every one of those patches logged "applied" for fourteen versions and changed
; nothing you could feel.  They are left at their shipped values on purpose: they do still
; run for the on-foot camera, and flipping them now would confound the test below.
;
; WHAT THE TURRET LIMIT ACTUALLY IS.  CAM-E's per-frame aim delta is
;     yaw   = [obj+0x668] * [obj+0x648] * dt
;     pitch = [obj+0x66C] * [obj+0x630] * dt
; read at VA 0x0072328B and 0x007232B4 inside the per-frame update (vtable slot 4,
; 0x00723140).  [+0x648]/[+0x630] are your input, and they are NOT clamped - measured
; range on +0x010 was +-3881 with 0.0% of samples at any ceiling.  [+0x668] and [+0x66C]
; are the turn-rate constants and both read EXACTLY 1.5 rad/s = 85.94 deg/s, live, and
; never change during play (they are constructor-only, from stack args, so there is no
; constant in the exe to point at).  Peak motion in a 30 s hard sweep was 0.4931 deg/frame
; ~= 72 deg/s, i.e. 84% of that ceiling.  So a 180 degree turn cannot take less than 2.09 s
; no matter how hard you push the mouse - which is "sluggish as soon as you move past a
; certain speed", verbatim.
;
; TurnRateScale multiplies the constant as it is read, so it scales the CEILING and leaves
; the input response curve exactly as shipped.  1.0 = off, and the detour then multiplies
; by 1.0, which reproduces the shipped 1.5 bit for bit (F8 sets it live).  Accepted range is
; 1.0..10.0; anything outside that is treated as off, because below 1 makes the turret
; slower than stock and a large value makes it unaimable rather than responsive.
;   1.0 = shipped      85.9 deg/s   180 deg in 2.09 s
;   2.0 = shipped x2  171.9 deg/s   180 deg in 1.05 s   <- default, a conservative first test
;   3.0 = shipped x3  257.8 deg/s   180 deg in 0.70 s
;   4.0 = shipped x4  343.8 deg/s   180 deg in 0.52 s
; Retune from here, no rebuild needed.  Two things are deliberately NOT scaled: the
; target-tracking slew at 0x00723D92 (that is the sticky-over-an-enemy behaviour you want
; gone, not sped up) and the constructor, because 0x0072272E multiplies [+0x66C] by
; [+0x668] - scaling the fields instead of the reads would make that product quadratic.
TurnRateScale=2.0
; ---------------------------------------------------------------------------------------
; v62: the FLOOR, and the reason a multiplier was not enough.
; The ceiling is per-mount record data, not a constant: CAM-E's constructor copies
; [+0x668]/[+0x66C] from the mount's own parameter record, and a census over 44 mount records
; measured them from 0.35 to 1.5 rad/s.  The light turret is the fast end (1.5); heavy mounted
; weapons - the 105mm artillery among them - are near the slow end.  TurnRateScale multiplies
; the spread; it cannot close it, so x3 that felt right on the turret left the artillery
; sluggish.  This build therefore computes
;     effective rate = max( recordRate x TurnRateScale , MinRateRad )
; and the default 1.5 is the light turret's own shipped rate, which makes the floor a no-op on
; the turret and a pure lift on everything slower (0.35 x 3 = 1.05 -> 1.5).
;   1.5 rad/s =  86 deg/s   180 deg in 2.09 s   <- default
;   2.2 rad/s = 126 deg/s   180 deg in 1.43 s
;   3.0 rad/s = 172 deg/s   180 deg in 1.05 s
;   4.5 rad/s = 258 deg/s   180 deg in 0.70 s
; 0 disables the floor and leaves a pure multiplier.  Accepted range 0.0..10.0.
; The base rate is constructor data, so REMOUNT before judging a change.
MinRateRad=1.50
; v62: "are there other cameras with this same slow aim?" - answered by a sweep of all five
; sibling camera classes.  Exactly ONE other has CAM-E's rate x command x dt shape: CAM-B
; (vtable 0x00BD20B0), for YAW only, at 0x007197AD.  CAM-A, HUMAN and CAM-D have no such
; product, and CAM-B has no rate term for pitch at all (its 0x00719689 path is a
; subss/divss/comiss clamp instead, a different mechanism), so a CAM-B mount gets yaw covered
; and its pitch stays as shipped.
; Off by default: no capture has yet shown CAM-B driving a slow aim, and the artillery is
; served by a live CAM-E, which the floor above already fixes.  Set to 1 if a mount is still
; slow after remounting with MinRateRad, since CAM-B is then the only remaining ceiling that
; could be holding it back.  Uses the same TurnRateScale and MinRateRad.
PatchCamBTurnRate=0
; ---------------------------------------------------------------------------------------
; v57: THE SECOND LIMITER, THE ONE THAT CAUSES "GO LEFT RIGHT FAST AND THE AIM JUST STAYS IN A
; SINGLE SPOT".  v56's verdict was "better but not fully fixed", and that residual is a
; different mechanism - so much so that a rate ceiling cannot produce it at all.  A ceiling makes
; you slow; only a term going to ZERO makes you stationary.
;
; [+0x648] (yaw) and [+0x630] (pitch) are NOT copies of your mouse.  They are the state slots of
; two first-order lag filters embedded in CAM-E at +0x638 and +0x620, 24 bytes each:
;     P_new = P + (V - P) * (1 - X) * dt * 60
; advanced by the shared advancer 0x0070D4C0 and stored at 0x0070D582, with X an inertia float
; that the constructor copies in at 0x00722E4B..0x00722E85.  The target V is
;     V = -clamp([+0x010] * 0.25, -1, +1)
; (mulss 0x0072302D, clamp 0x0072304A/0x00723054), so a hard flick and a gentle move both give
; |V| = 1 - the command's speed of travel is set by X alone and NEVER by how hard you push.
;
; X WAS MEASURED, NOT GUESSED: inverting the equation per frame over 2706 frames of a live CAM-E
; dump gives X = 0.955 while the command grows and 0.915 while it shrinks - the shipped 0.95 and
; 0.90.  At the 139 fps that run held, dt*60 = 0.43, so the command closed 2.2% of the remaining
; gap per frame: a step of 0.022, which is exactly the 0.017..0.022 band of the fast-sweep frames
; and the 0.032 cliff the census found.  Reversing direction therefore spends ~20 frames walking
; the command back through zero, and on a quick left-right it never gets out of the middle (mean
; |P| 0.16, against 0.55 on a sustained turn).  v56 doubled a ceiling that was not being reached
; during sweeps, which is why it helped long turns and did nothing here.
;
; CommandResponse scales the six inertia floats once, in a cave hung off CAM-E's single
; constructor exit (0x00722E9D), as
;     X' = X * K + (1 - K)      floored at 0.0
; which is the same as 1 - (1-X)*K: K is how many times faster the gap closes.  1.0 = off, and
; nothing is written at all in that case.  The upper bound is not arbitrary - with the shipped
; 0.90 the transform reaches EXACTLY 0 at K=10, i.e. the command becomes the target with no lag,
; and past that it would overshoot and oscillate.  Values outside 1.0..10.0 are refused and
; treated as off; the cave also floors every field at 0.0 so an unexpected shipped value cannot
; destabilise it.
;   K = 1.0  shipped:  closes  2.2% of the gap per frame, time constant 0.33 s
;   K = 2.0           :  4.3%,  0.17 s
;   K = 4.0           :  8.6%,  0.08 s
;   K = 6.0           : 12.9%,  0.05 s   <- default, ~7 frames to settle
;   K = 10.0          : 30.0%,  0.02 s   <- instant for pitch (X'=0), 0.5 inertia for yaw
;
; READ THIS BEFORE JUDGING THE TEST: the coefficients are consumed when the camera object is
; BUILT, so this applies the NEXT TIME YOU MOUNT, not to the turret you are sitting in when the
; mod loads.  Get in and out of a vehicle once before deciding.  F8 sets K back to 1.0, which
; likewise only affects cameras mounted after the keypress - the current one keeps the scaled
; feel until you remount.
;
; What this does NOT touch: the 1.5 rad/s ceiling (v56's, still behind TurnRateScale), the +-1
; clamp on V, the arc-limit zero written at 0x00722F92, the dead-zone reset, or the dt
; sub-stepping at 1/60.  The whole shipped algorithm still runs; only how fast it closes on its
; own target changes.  The two fields the advancer reads (+0x00 and +0x04 of each track) are both
; scaled, plus the continued-input one (+0x08), so no branch of the filter is left at stock.
CommandResponse=1.0

[Shadow]
; The shadow atlas is created from literal immediates only - there is no config,
; script or wad path that sets it, and Mercs2.ini has no shadow-size key.  Shipped
; size is 1024 x 4096: four 1024^2 cascades stacked vertically inside 0x00755D93.
; 15 separate operands encode that geometry and they MUST move together (10 push
; width/height pairs, three rect constants at 0x0075612F/4C/69, the cascade count
; store at 0x00756187, and the per-cascade size at 0x007562B5).  A partial scale
; leaves cascades that no longer tile the atlas, so this is all-or-nothing: every
; operand is byte-checked against the shipped value first and nothing is written
; if any one of them mismatches.
;   1 = untouched (default)
;   2 = 2048 x 8192, ~+130 MB VRAM
;   4 = 4096 x 16384, only attempt this if 2 works
; The unresolved question is whether the shader's baked constant
; def_c (1/2048, 1/8192, 1024.0, 4096.0) - present in 315 shadow blobs of
; shader3.bin, which is a signed index we cannot rewrite - is overridden at
; runtime.  If it is not, the atlas gets bigger but the sampling math stays at
; the old scale and shadows will land at the wrong size or vanish.  That is not
; a crash risk, but it is the reason this defaults to 1.  If shadows look wrong
; after setting 2, put it back to 1.
;
; ANSWERED 2026-10-01, and it is the bad branch: that float4 is NOT a
; 2048x8192 texel size.  It is (0.5/W, 0.5/H, W, H) for W,H = 1024,4096 - the
; x/y halves are the PCF half-texel tap unit and the z/w halves the atlas
; dimensions, so the constants describe the map the game already allocates.
; The 3x3 tap grid sits { -1, +1, +3 } units apart = exactly one texel of the
; current atlas, in all 315 blobs.  Scaling the RT from the exe alone therefore
; puts the taps 2 texels apart and runs the bilinear weights at half the texel
; rate: banding and streaks at the shadow edges, at 4x the memory cost.
;
; SOLVED 2026-10-03, and the shader file IS rewritable.  shader3.bin is an
; engine hash-directory of SM3.0 bytecode with no checksum over the shader data
; (the only CRC strings in the loader are zlib's, for the Precache streams), and
; a def_c record is 24 bytes with the float4 payload at +8, so each constant is
; an in-place 16-byte swap that moves no blob offset and changes no hash key.
; Measured on the installed file: the three texel-derived vectors occur exactly
; 315 times each, every hit on a record payload, zero misaligned strays, and one
; atlas vector pairs with one of each tap vector.  shader3Low.bin, shaderR2VB*.
; bin, shaderVT*.bin and the exe itself hold ZERO copies, so there is no second
; place the constants live and no runtime override table - the file is it.  The
; Precache\*.precache files contain no ps_3_0 bytes and no sampled chunk
; matches shader3.bin, so they do not shadow the edit either.  The low-detail
; path is safe on its own: its 198 shadow shaders do one bare texldp_pp with no
; PCF and no atlas constant.
;
; So this is now a TWO-STEP switch and both steps are required:
;   1. with the game CLOSED, run   python tools\shadow_res.py set 2
;      (first run makes data\shader3.bin.mercs2orig; `restore` is byte-identical)
;   2. MapSizeScale=2 here, then start the game.
; Mercs2Fix reads data\shader3.bin at startup and applies the 15 immediates ONLY
; if the file is baked at exactly this scale.  If it is not - including if the
; file cannot be read or has two scales mixed in it - nothing is written and the
; log says so.  That makes the half-scaled, banded-edge state unreachable.
; `python tools\shadow_res.py probe` prints the scale on disk, and the menu's
; "Shadow map resolution" row shows atlas and shader side by side.
;   1 = untouched (default)
;   2 = atlas 2048 x 8192, four 2048^2 cascades, ~+130 MB VRAM
;   4 = atlas 4096 x 16384; only attempt this if 2 works
MapSizeScale=1

; Shadow CAST distance.  ShadowBaseDistance is a float the game loads per level
; into [[0x00DFC2F8]+0x2BC0] (shipped value 10, logged at capture) and it has
; exactly ONE consumer in the entire executable: 0x00859322, which builds four
; caster bands as base * 3^i.  This multiplies at that consumer, so all four
; bands move together and the stored value itself is never written - setting it
; back to 1.0 uninstalls the patch, there is nothing to repair.
;   1.0 = off (default, no code written)
;   2.0 = cast bands 20/60/180/540 instead of 10/30/90/270
;   4.0 = four times further; expect a visible fill-rate cost at 4K, and
;         shadows thinning out at the far band because the same 1024-wide atlas
;         now covers four times the world area.
; This is the one that answers "shadows stop too close".  It does NOT make them
; sharper - resolution is the blocked item above.
;
; SHARPNESS, though, is available here for free, and this is the honest answer to "bump the
; shadow resolution 2x more".  What decides how soft a shadow edge looks is how many world
; units one shadow texel covers:
;     units per texel  =  10 x BaseDistanceScale / (1024 x MapSizeScale)
;     stock        10/1024  = 0.0098
;     6.00 at x4   60/4096  = 0.0146    (1.5x coarser than stock, but 6x the reach)
;     3.00 at x4   30/4096  = 0.0073    (SHARPER than stock, 3x the reach)
; So dropping this key is a 2x sharpness gain, needs no rebuild, and writes no new code - the
; trade is half the cast distance, which is what raising it bought in the first place.
; Raising MapSizeScale instead is NOT possible beyond 4: the atlas's own geometry is encoded in
; a shader constant that holds four 32-bit floats, and at 8x the half-texel reciprocals are no
; longer representable; the sole consumer of the map also forces a square viewport, so the four
; cascades cannot be re-split out of the spare height.
; One more thing to know before judging softness: dynamic objects do not use this atlas at all.
; They are drawn with the PgBlobShadowVP/FP family, which is resolution-independent by
; construction, so no atlas change can sharpen a moving vehicle's shadow - only static
; geometry's.
BaseDistanceScale=1.0

[Camera]
; v36 proved flooring these changes nothing. 0 = off.
MinYawPitch=0

; v58: look up/down during a crouch or slide.  HUMAN's per-frame update (0x0071DC40) reads a
; state byte that 0x0071D790 fills (0x0071DDB5 `mov al,[esp+0x17]`) and tests it a second later
; (0x0071DE09).  When it is set, 0x0071DE11 `jne 0x0071DE90` takes a branch that adds the mouse
; yaw to camera +0x618 and then never touches the pitch delta at [esp+0x1c] - a scan of that
; whole branch (0x0071DE90..0x0071DFC0) finds zero reads of that slot.  The other side of the
; same test does apply it, at 0x0071DE69 into +0x61C.  So the pitch you push during a crouch is
; not slowed down or clamped, it is thrown away.
; =1 NOPs those two bytes, which makes the pitch apply unconditional.  Length-preserving (rel8
; jne -> 2 NOPs), so no branch target anywhere in the function moves.
; This is read ONCE at startup and cannot be a menu slider: the site is on the per-frame hot
; path and a 2-byte write there is not atomic against the game fetching those bytes as
; instructions, so a live toggle could let it execute `nop` + `jg <garbage>`.  Change it,
; restart the game.
;   1 = free vertical aim while crouched/sliding (default)
;   0 = shipped behaviour, the lock stays
FreePitchInCrouch=1

[View]
; v58: general DRAW distance, i.e. the far clip plane.  This is the ini form of the menu's
; "View distance" row and both write the same thing: the integer at [0x00DFC348], which the
; game fills itself from Mercs2.ini (0x007537A7 calls GetPrivateProfileIntA("Render",
; "ViewDistance", 100, ini)) and which has exactly three references in all of .text - that one
; writer and two readers inside the far-plane computation at 0x007141C7:
;
;     far = 400 + 20 x ViewDistance          (0x007141F4..0x00714216)
;     near = [ebx+0x5E0], a hard 0.2
;
; So your current Mercs2.ini [Render] ViewDistance=300 puts the far plane at 6400 world units,
; and 600 puts it at 12400.  The value is re-read by the renderer every frame, which is why the
; menu can change it live; the keep-alive re-asserts it if the game reloads a level.
;   0 = leave whatever the game read from Mercs2.ini (default; the menu starts from it)
;   300 = the value Mercs2.ini currently holds
;   600 = top of the range driven so far; 2x the shipped far plane
; Depth precision is the limit, not the data type: near is fixed at 0.2, so the depth ratio
; doubles with the far plane and past a point distant surfaces start fighting for the same z.
; If far geometry starts z-fighting or flickering, come back down.
;
; This is a DIFFERENT number from fog: [0x00BEAEF8] = 2400.0 is the sentinel that tells the same
; routine "use the computed far plane" (any value < 2400 replaces it), and the game's own
; per-map fog setting is cooked into the level data, not live.  Raising draw distance does not
; raise how far shadows reach - that is [Shadow] BaseDistanceScale above.
Distance=0
[Vehicle]
; v59: the CAR / vehicle camera's re-centre.  Report: "car camera re centres very fast and
; sharply - bigger delay and more smoothnes instead of being very abrupt".  Those are two
; different numbers in the shipped code, so they are two different keys and two menu rows.
;
; The class is CAM-A: vtable 0x00BD2060, constructor 0x00715D20 (vtable store at 0x00715D41).
; Its record is deserialized by 0x0065E1D0 and holds StickLength, SpringStrength,
; SpringDampening, FirstPersonOffset/Pitch, FirstPersonReverseOffset/Pitch and YawResetTime -
; a stick, a spring and forward/reverse first-person seats is a vehicle chase camera.
; Two of its fields are written inside that constructor and nowhere else:
;
;   0x00715DC0  movss [edi+0x668],xmm0   ; hold time = YawResetTime / 12 = 3.25/12 = 0.2708 s
;   0x00715DD0  movss [edi+0x66C],xmm0   ; blend window = 0.5, compiled in at [0x00BBB99C]
;
; and the re-centre consumes them (method 0x00717780):
;   while you are looking around, the countdown [+0x64C] is re-armed to hold+window
;                                                       (0x00717923 / 0x0071792B / 0x00717933)
;   with no input it counts down by dt, floored at 0   (0x00717800 / 0x00717808)
;   blend weight k = clamp([+0x64C] / [+0x66C], 0, 1)  (0x00717193 / 0x0071719B / 0x007171A6)
;   k is read once, at 0x007172BB, and lerps [+0x620] toward its default [+0x664]
;
; So the camera holds for a quarter second and then takes half a second to settle - which is
; exactly "fast and sharp".  +0x668 lengthens the hold, +0x66C lengthens the settle, and they
; are independent: a long hold with a short window postpones the snap without softening it.
;
; BOTH ARE CONSTRUCTOR-ONLY.  The value is read when a vehicle camera is BUILT, so changing a
; row in the menu applies to the NEXT vehicle you get in, the same rule as [Turret]
; CommandResponse.  The camera you are currently driving keeps its numbers.
;
; +0x66C is a divisor (0x0071719B), so it must never reach 0.  Scales multiply it upward from
; 0.5, which cannot do that, and out-of-range values are treated as 1.0 (off) rather than
; clamped.  8.0 is the practical top: 2.17 s of hold and a 4 s settle already overlaps the next
; look input instead of finishing.
;
; F8 does not touch either of these: that key is the input kill, and it has work to do on the
; camera fields the re-centre reads.  Set a scale back to 1.0 and re-enter the vehicle instead.
;   1.0 = shipped (default; nothing is patched unless the menu is enabled)
ResetDelayScale=1.0
ResetBlendScale=1.0

[Menu]
; v58: the in-game settings panel.  Insert opens it, Insert closes it and saves.
; Up/Down pick a row, Left/Right change it, PgUp/PgDn change it x10.
; The panel is a click-through, non-activating layered window, so it never takes focus and the
; mouse still aims through it.  While it is OPEN the panel's own navigation keys are eaten before
; they reach the game, so steering a slider does not steer your character.
;   Enabled=1 also arms the runtime levers that would otherwise install only when their ini key
;   is non-neutral (shadow scale, turret rate, turret command lag, and CAM-A's hold and blend
;   stores) at their neutral values, so the sliders have something to drive.  Each is a multiply
;   by exactly 1.0f, which is bit-identical to no patch at all, so this costs effect-free cave
;   installations and nothing else.  The crouch pitch gate is NOT among them: it patches a
;   per-frame instruction and cannot be armed or toggled live, see [Camera] FreePitchInCrouch.
;   Enabled=0 installs nothing extra and the game is patched exactly as the ini says.
Enabled=1
; =1 writes changed rows back into Mercs2Fix.ini on close, so the panel and the ini cannot
; disagree.  =0 makes the panel a temporary, this-run-only control and leaves the ini alone.
SaveToIni=1
; One conflict to know about: [AimAssist] PatchAtInsert is an old diagnostic that also binds
; Insert.  It defaults to 0 and should stay 0, otherwise one press does both.

[Seat]
Logging=1
MaxRecords=24
DeferToCapture=0
; Seat writes disabled for v34 - proven ineffective in v31/v32/v33.
ZeroFarAimAssist=0
CloseAimAssistFloor=0
YawNoInputInertiaCeiling=0

[Settings]
; v39/v40 were the parameter-tracing experiment: patch the call sites, then hook
; GetSettingFloat (VA 0x656320) and HashName (0x824270) themselves, so every read
; of every setting name is visible and overridable at the only upstream point
; (values are stream-read while a record loads, then copied - which is why all
; eleven post-load container writes were invisible).
; v41 turns this OFF.  The static RE answered the same question a better way: the
; aim-assist numbers in a HumanCameraModifier record are not gameplay values at
; all, they are enum indices into a hard-coded constant table.  Tracing or
; overriding the reads would still change nothing.  Set Enabled=1 to resume
; load-time value tracing; its log lines are GSHAPE/GVALUE/SWRITE and the CAPTURE
; GSA summary.
Enabled=0
LogWatch=1
; LogHashNames=1 arms hook A (which name is being hashed, and by whom).
LogHashNames=1
; HookAll=1 installs stubs at all 669 named call sites; PatchSites=1 arms the v39
; per-site redirects.  Both proven dead - v39 fired zero reads across a real load.
HookAll=0
PatchSites=0
; Any KEY=VALUE line below that is not one of the switches above is a forced value
; for that setting name, applied inside the getter (so it needs Enabled=1).
; Read the GVALUE lines before forcing anything.
;HorizontalAimAssistClose=0.0
;HorizontalAimAssistFar=0.0
;VerticalAimAssistClose=0.0
;VerticalAimAssistFar=0.0
;CloseAimAssist=0.0
;FarAimAssist=0.0
;MaxAimAngle=0.0
;TimeForAimState=0.0
;YawNoInputInertia=1.0
;PitchNoInputInertia=1.0
;InputInertiaNoInput=1.0
;CrouchYawSpeed=2.0
;CrouchPitchSpeed=2.0
;HorizontalAimAssistFar=0.0
;VerticalAimAssistClose=0.0
;VerticalAimAssistFar=0.0
;CloseAimAssist=0.0
;FarAimAssist=0.0
;MaxAimAngle=0.0
;TimeForAimState=0.0
;YawNoInputInertia=1.0
;PitchNoInputInertia=1.0
