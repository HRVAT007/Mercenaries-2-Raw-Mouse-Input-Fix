; Mercs2Fix - Mercenaries 2: World in Flames
;
; Put this file next to Mercs2Fix.asi, which goes next to Mercenaries2.exe.
; Everything here is also a row in the in-game settings panel: press Insert while playing.
; docs/Mercs2Fix.annotated.ini documents every key, including the developer switches that
; ship off, and the reverse-engineering notes behind each patch.


[Borderless]
; True borderless at whatever resolution you pick in the game's own video options.
Enabled=1
; Force the D3D9 device windowed (FullScreen_RefreshRateInHz=0).  Without this the game
; takes the display exclusive and borderless cannot be done from the window side.
ForceWindowedD3D=1
VsyncOff=0


[View]
; Draw distance.  The game computes  far clip plane = 400 + 20 x Distance, so 100 gives
; 2400 (stock) and 300 gives 6400.  Read every frame, so the panel changes it live.
;   0 = leave whatever Mercs2.ini [Render] ViewDistance says (the panel starts from that)
; Keep this at 100 unless you want to test the higher values: above roughly 300 some
; dynamic objects (the player, mounted weapons) can vanish at certain camera angles while
; their interaction prompt stays on screen.  That is a bug in the game, not in this mod -
; every CPU-side culling path was measured and cleared.  See README.md.
Distance=100


[AimAssist]
; The three patches that change how aiming feels, all at byte-verified sites.
; NopAssistStore removes the aim-assist correction the game adds to your mouse yaw.
; NopLockOnHold stops a held lock-on key from eating the frame's aim input.
Disable=1
NopAssistStore=1
NopLockOnHold=1


[Prompts]
; Show keyboard glyphs instead of controller buttons in the on-screen prompts.
; The exe already carries the pad-to-keyboard sprite remap, so this only flips the
; detected-input byte the prompts read.
KeyboardIcons=1


[Turret]
; Mounted weapons (artillery, boat gunner, vehicle turrets).  The game slows aim three
; ways when it thinks the mount is manned; these defeat all three.
MountedScaleOne=1
ForceNormalParams=1
ForceNormalSmooth=1
NeverManned=1
; Turn rate: the game caps a turret at 1.5 rad/s and the cap is a per-frame hard stop.
; 3.00 = 4.5 rad/s = 258 deg/s.  MinRateRad is the floor that replaces the cap, so a
; mount with a slower shipped rate is not sped up past it.
TurnRateScale=3.0
MinRateRad=4.50
; Aim response: kills the inertia that made the crosshair stay put during a fast sweep.
; The coefficients are read when the camera is BUILT, so this applies the next time you
; get in.  F8 reverts both of these rows for the rest of a run, for A/B comparison.
CommandResponse=6.00
; CAM-B is a second camera class with its own copy of the yaw limiter.  Its mount
; coverage was not confirmed in play, so it ships off.
PatchCamBTurnRate=0


[Camera]
; Look up and down during a crouch or slide.  The game drops the pitch delta on that one
; camera branch; removing the branch is what gives vertical aim back.  Read once at
; startup, so it is ini-only - change it and restart.
FreePitchInCrouch=1


[Vehicle]
; The car camera keeps pointing where you left it and then pulls back.  Stock is a 0.27 s
; hold and a 0.50 s settle, which reads as a snap.  Both apply to the NEXT vehicle you
; enter.
ResetDelayScale=6.25
ResetBlendScale=3.50


[Shadow]
; Shadow map resolution.  BOTH halves have to move together: this key scales the atlas the
; game allocates, and the PCF filter that reads it has the texel size baked into
; data\shader3.bin.  With the game closed, run
;     python tools\shadow_res.py set 4
; (the shader\shader3.x4.bin shipped here is exactly what that produces, so you can copy it
; over data\shader3.bin instead - make a backup first).  Then set this to 4.  Mismatched
; halves give you a shadow kernel that samples the wrong grid; the log says so on one line.
MapSizeScale=4
; Cast distance.  The game builds four cascader bands as base x 3^i; this multiplies the
; base at its single consumer, so the shipped value is never written.  Higher costs fill
; rate.  1.00 = stock.
BaseDistanceScale=6.00


[Menu]
; Insert opens the settings panel.  SaveToIni makes each change you make there persist to
; this file.
Enabled=1
SaveToIni=1
